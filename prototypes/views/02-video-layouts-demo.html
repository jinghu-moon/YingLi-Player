<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>影里 · 视频布局 Demo</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.34.1/dist/tabler-icons.min.css">
  <style>
    :root{color-scheme:light;--page:#f5f5f5;--surface:#fff;--subtle:#fafafa;--component:#eee;--component-hover:#e0e0e0;--text:#1f1f1f;--muted:#686d68;--line:#dedfdd;--line-strong:#737773;--primary:#1f1f1f;--on-primary:#fff;--steel:#477b94;--steel-soft:#e5f1f7;--warning:#a66a0d;--warning-soft:#fff0c6;--radius-sm:6px;--radius-md:8px;--shadow:0 1px 2px rgb(0 0 0/.08),0 7px 20px rgb(0 0 0/.06);--shadow-phone:0 30px 76px rgb(16 20 17/.24)}
    [data-theme=dark]{color-scheme:dark;--page:#101110;--surface:#171817;--subtle:#1f211f;--component:#292b29;--component-hover:#353835;--text:#f1f2ef;--muted:#aeb4ac;--line:#303430;--line-strong:#70766e;--primary:#f1f2ef;--on-primary:#141514;--steel:#8fc4d8;--steel-soft:#20343b;--warning:#e8b25e;--warning-soft:#49391e;--shadow:0 1px 2px rgb(0 0 0/.3),0 8px 24px rgb(0 0 0/.2);--shadow-phone:0 30px 76px rgb(0 0 0/.5)}
    *{box-sizing:border-box}body{margin:0;min-width:320px;background:#e2e5e2;color:var(--text);font-family:Inter,"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;letter-spacing:0}button,input{font:inherit;letter-spacing:0;color:inherit}button{border:0;cursor:pointer}
    .stage{min-height:100vh;display:grid;place-items:center;padding:24px 16px}.stage-caption{position:fixed;top:16px;left:20px;color:#66706a;font-size:12px}.phone{position:relative;width:min(390px,calc(100vw - 32px));height:min(844px,calc(100vh - 52px));min-height:630px;padding:10px;border:1px solid #090a09;border-radius:44px;background:#0b0c0b;box-shadow:var(--shadow-phone)}.phone-screen{position:relative;width:100%;height:100%;overflow:hidden;border-radius:34px;background:var(--surface)}.speaker{position:absolute;top:16px;left:50%;z-index:20;width:76px;height:21px;transform:translateX(-50%);border-radius:16px;background:#090a09}.camera{position:absolute;top:23px;left:calc(50% + 35px);z-index:21;width:6px;height:6px;border:1px solid #303330;border-radius:50%;background:#111}.side{position:absolute;right:-3px;width:3px;border-radius:0 3px 3px 0;background:#191b19}.side.top{top:145px;height:66px}.side.bottom{top:229px;height:38px}.status{position:absolute;top:0;right:0;left:0;z-index:18;height:31px;display:flex;align-items:center;justify-content:space-between;padding:0 17px;color:var(--text);font-size:10px;font-weight:650;pointer-events:none}.status-icons{display:flex;gap:5px;align-items:center;font-size:12px}.viewport{position:absolute;inset:31px 0 0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
    .appbar{height:64px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;padding:0 9px;border-bottom:1px solid var(--line);background:var(--surface)}.appbar-title{text-align:center;font-size:20px;font-weight:650}.appbar-action{width:44px;height:44px;display:grid;place-items:center;border-radius:7px;background:transparent;color:var(--muted);font-size:22px}.appbar-action:hover{background:var(--component);color:var(--text)}.appbar-action.task{position:relative}.task-badge{position:absolute;top:4px;right:3px;min-width:15px;height:15px;display:grid;place-items:center;padding:0 3px;border:2px solid var(--surface);border-radius:9px;background:var(--steel);color:#fff;font-size:8px}
    .page{padding:18px 16px 90px}.search{height:48px;display:flex;align-items:center;gap:10px;padding:0 13px;border:1px solid var(--line-strong);border-radius:7px;background:var(--surface)}.search i{color:var(--muted);font-size:19px}.search input{width:100%;border:0;outline:0;background:transparent;font-size:13px}.search input::placeholder{color:var(--muted)}.filters{display:flex;gap:8px;margin:14px 0 18px;overflow-x:auto;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.chip{min-height:34px;flex:0 0 auto;padding:0 14px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--muted);font-size:12px}.chip:hover{background:var(--component)}.chip.active{border-color:var(--primary);background:var(--primary);color:var(--on-primary);font-weight:620}.control-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}.result-meta{color:var(--muted);font-size:12px}.layout-switch{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:3px;border-radius:7px;background:var(--component)}.layout-switch button{min-width:52px;height:31px;border-radius:5px;background:transparent;color:var(--muted);font-size:12px}.layout-switch button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow);font-weight:620}
    .media-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 10px}.card{min-width:0}.thumb{position:relative;overflow:hidden;aspect-ratio:16/9;border-radius:var(--radius-sm);background:var(--component)}.thumb img{width:100%;height:100%;display:block;object-fit:cover}.duration{position:absolute;right:6px;bottom:6px;padding:3px 5px;border-radius:3px;background:rgb(0 0 0/.74);color:#fff;font-size:10px}.watch-bar{position:absolute;right:0;bottom:0;left:0;height:4px;background:rgb(255 255 255/.34)}.watch-bar span{display:block;height:100%;background:#fff}.card-title{margin:8px 1px 0;display:-webkit-box;overflow:hidden;-webkit-box-orient:vertical;-webkit-line-clamp:2;font-size:13px;line-height:1.4;font-weight:620}.card-meta{display:flex;justify-content:space-between;gap:7px;margin-top:5px;color:var(--muted);font-size:10px}.card-meta span:last-child{white-space:nowrap}.card-actions{display:flex;justify-content:flex-end;margin-top:5px}.more{width:32px;height:32px;display:grid;place-items:center;border-radius:5px;background:transparent;color:var(--muted);font-size:18px}.more:hover{background:var(--component);color:var(--text)}
    .media-grid.list{display:grid;grid-template-columns:1fr;gap:0}.media-grid.list .card{display:grid;grid-template-columns:112px minmax(0,1fr) 34px;grid-template-rows:auto auto;gap:4px 12px;align-items:center;min-height:104px;padding:9px 0;border-bottom:1px solid var(--line)}.media-grid.list .thumb{grid-column:1;grid-row:1/3;aspect-ratio:16/10;border-radius:5px}.media-grid.list .card-title{grid-column:2;grid-row:1;margin:0;font-size:13px;line-height:1.35;-webkit-line-clamp:2}.media-grid.list .card-meta{grid-column:2;grid-row:2;justify-content:flex-start;gap:12px;margin-top:0}.media-grid.list .card-actions{grid-column:3;grid-row:1/3;margin:0}.media-grid.list .more{width:34px;height:40px}.media-grid.list .watch-bar{height:3px}
    .media-grid.masonry{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px 10px;align-items:start}.media-grid.masonry .thumb{aspect-ratio:auto}.media-grid.masonry .thumb img{height:auto;aspect-ratio:auto;object-fit:cover}.media-grid.masonry .card-title{margin-top:8px}.media-grid.masonry .card-meta{margin-top:5px}.media-grid.masonry .card:nth-child(2) .thumb img{aspect-ratio:4/5}.media-grid.masonry .card:nth-child(3) .thumb img{aspect-ratio:5/4}.media-grid.masonry .card:nth-child(5) .thumb img{aspect-ratio:3/4}
    .bottom{position:absolute;right:0;bottom:0;left:0;z-index:12;height:72px;display:grid;grid-template-columns:repeat(4,1fr);padding:7px 8px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px)}.bottom button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:7px;background:transparent;color:var(--muted);font-size:10px}.bottom i{width:42px;height:28px;display:grid;place-items:center;border-radius:14px;font-size:20px}.bottom button.active{color:var(--text);font-weight:650}.bottom button.active i{background:var(--primary);color:var(--on-primary)}
    .toast{position:fixed;left:50%;bottom:23px;z-index:30;display:flex;align-items:center;gap:7px;padding:10px 14px;transform:translate(-50%,18px);border-radius:7px;background:var(--primary);color:var(--on-primary);box-shadow:var(--shadow);font-size:12px;opacity:0;pointer-events:none;transition:.2s ease}.toast.show{transform:translate(-50%,0);opacity:1}
    .sheet-scrim{position:absolute;inset:0;z-index:22;display:none;background:rgb(0 0 0/.42)}.sheet-scrim.open{display:block}.view-sheet{position:absolute;right:0;bottom:0;left:0;z-index:23;display:none;max-height:82%;overflow:auto;padding:10px 22px 24px;border-radius:22px 22px 0 0;background:var(--surface);box-shadow:0 -12px 34px rgb(0 0 0/.16)}.view-sheet.open{display:block}.sheet-handle{width:48px;height:5px;margin:0 auto 23px;border-radius:999px;background:var(--line-strong)}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.sheet-head h2{margin:0;font-size:20px;font-weight:650}.sheet-close{width:40px;height:40px;display:grid;place-items:center;border-radius:7px;background:transparent;color:var(--muted);font-size:21px}.sheet-close:hover{background:var(--component)}.setting-group{padding:0 0 21px;margin-bottom:20px;border-bottom:1px solid var(--line)}.setting-group:last-of-type{border-bottom:0;margin-bottom:0}.setting-group h3{margin:0 0 12px;font-size:14px;font-weight:620}.setting-options{display:flex;flex-wrap:wrap;gap:8px}.setting-option{min-height:38px;padding:0 14px;border:1px solid var(--line-strong);border-radius:7px;background:var(--surface);color:var(--muted);font-size:13px}.setting-option.active{border-color:var(--primary);background:var(--primary);color:var(--on-primary);font-weight:620}.setting-option i{margin-right:6px;color:var(--steel)}.setting-option.active i{color:inherit}
    @media(max-width:430px){.stage{padding:0}.stage-caption{display:none}.phone{width:100vw;height:100vh;min-height:0;padding:0;border:0;border-radius:0;box-shadow:none}.phone-screen{border-radius:0}.speaker,.camera,.side{display:none}.page{padding-left:16px;padding-right:16px}}
  </style>
</head>
<body>
  <div class="stage"><span class="stage-caption">影里 · 视频库布局预览</span><div class="phone" aria-label="影里视频库手机预览"><span class="speaker" aria-hidden="true"></span><span class="camera" aria-hidden="true"></span><span class="side top" aria-hidden="true"></span><span class="side bottom" aria-hidden="true"></span><div class="phone-screen"><div class="status"><span>20:56</span><span class="status-icons"><i class="ti ti-wifi"></i><i class="ti ti-battery-4"></i></span></div><div class="viewport">
    <header class="appbar"><button class="appbar-action task" title="处理任务" aria-label="处理任务"><i class="ti ti-activity"></i><span class="task-badge">2</span></button><strong class="appbar-title">视频</strong><button class="appbar-action" id="moreButton" title="更多" aria-label="更多"><i class="ti ti-dots-vertical"></i></button></header>
    <main class="page"><label class="search"><i class="ti ti-search"></i><input id="searchInput" type="search" placeholder="搜索本地视频、文件夹或标签" autocomplete="off"></label><div class="filters" role="tablist" aria-label="视频筛选"><button class="chip active" role="tab" aria-selected="true">全部</button><button class="chip" role="tab" aria-selected="false">文件夹</button><button class="chip" role="tab" aria-selected="false">最近</button><button class="chip" role="tab" aria-selected="false">未看</button></div><div class="control-row"><span class="result-meta"><b id="resultCount">248</b> 个视频 · 最近添加</span><div class="layout-switch" role="group" aria-label="布局模式"><button class="active" data-layout="grid" aria-pressed="true">网格</button><button data-layout="list" aria-pressed="false">列表</button><button data-layout="masonry" aria-pressed="false">瀑布流</button></div></div>
      <section class="media-grid" id="mediaGrid" aria-live="polite">
        <article class="card" data-title="雾中车站 短片"><div class="thumb"><img src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=700&q=82" alt="雾中车站"><span class="duration">18:42</span><span class="watch-bar"><span style="width:48%"></span></span></div><h3 class="card-title">雾中车站 · 短片</h3><div class="card-meta"><span>今天 · 2.1 GB</span><span>1080p</span></div><div class="card-actions"><button class="more" aria-label="更多操作"><i class="ti ti-dots"></i></button></div></article>
        <article class="card" data-title="厨房实验室 第12集"><div class="thumb"><img src="https://images.unsplash.com/photo-1556910103-1c02745aae4d?auto=format&fit=crop&w=700&q=82" alt="厨房实验室"><span class="duration">42:08</span></div><h3 class="card-title">厨房实验室 · 第 12 集</h3><div class="card-meta"><span>昨天 · 1.4 GB</span><span>1080p</span></div><div class="card-actions"><button class="more" aria-label="更多操作"><i class="ti ti-dots"></i></button></div></article>
        <article class="card" data-title="纸上建筑 东京篇"><div class="thumb"><img src="https://images.unsplash.com/photo-1493780474015-ba834fd0ce2f?auto=format&fit=crop&w=700&q=82" alt="纸上建筑"><span class="duration">26:17</span><span class="watch-bar"><span style="width:17%"></span></span></div><h3 class="card-title">纸上建筑 · 东京篇</h3><div class="card-meta"><span>昨天 · 986 MB</span><span>4K</span></div><div class="card-actions"><button class="more" aria-label="更多操作"><i class="ti ti-dots"></i></button></div></article>
        <article class="card" data-title="一条河的来信"><div class="thumb"><img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=700&q=82" alt="河流风景"><span class="duration">12:33</span></div><h3 class="card-title">一条河的来信</h3><div class="card-meta"><span>8 月 31 日 · 742 MB</span><span>1080p</span></div><div class="card-actions"><button class="more" aria-label="更多操作"><i class="ti ti-dots"></i></button></div></article>
        <article class="card" data-title="声音地图 南方"><div class="thumb"><img src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?auto=format&fit=crop&w=700&q=82" alt="声音地图"><span class="duration">33:09</span></div><h3 class="card-title">声音地图 · 南方</h3><div class="card-meta"><span>8 月 30 日 · 1.2 GB</span><span>1080p</span></div><div class="card-actions"><button class="more" aria-label="更多操作"><i class="ti ti-dots"></i></button></div></article>
        <article class="card" data-title="蓝色时刻 海边"><div class="thumb"><img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=700&q=82" alt="海边"><span class="duration">08:56</span><span class="watch-bar"><span style="width:72%"></span></span></div><h3 class="card-title">蓝色时刻 · 海边</h3><div class="card-meta"><span>8 月 29 日 · 412 MB</span><span>720p</span></div><div class="card-actions"><button class="more" aria-label="更多操作"><i class="ti ti-dots"></i></button></div></article>
      </section>
    </main>
    <nav class="bottom" aria-label="一级导航"><button data-bottom-nav="home"><i class="ti ti-home-2"></i><span>首页</span></button><button class="active" aria-current="page" data-bottom-nav="video"><i class="ti ti-device-tv"></i><span>视频</span></button><button data-bottom-nav="organize"><i class="ti ti-folders"></i><span>整理</span></button><button data-bottom-nav="settings"><i class="ti ti-settings"></i><span>设置</span></button></nav>
    <div class="sheet-scrim" id="sheetScrim"></div><aside class="view-sheet" id="viewSheet" aria-label="视频视图设置"><div class="sheet-handle"></div><div class="sheet-head"><h2>视频视图</h2><button class="sheet-close" id="sheetClose" aria-label="关闭"><i class="ti ti-x"></i></button></div><section class="setting-group"><h3>布局</h3><div class="setting-options"><button class="setting-option active" data-sheet-layout="list"><i class="ti ti-list"></i>列表</button><button class="setting-option" data-sheet-layout="grid"><i class="ti ti-layout-grid"></i>网格</button><button class="setting-option" data-sheet-layout="masonry"><i class="ti ti-layout-masonry"></i>瀑布流</button></div></section><section class="setting-group"><h3>排序方式</h3><div class="setting-options"><button class="setting-option active"><i class="ti ti-arrow-down"></i>降序</button><button class="setting-option">添加时间</button><button class="setting-option">修改时间</button><button class="setting-option">标题</button><button class="setting-option">时长</button><button class="setting-option">大小</button></div></section><section class="setting-group"><h3>观看状态</h3><div class="setting-options"><button class="setting-option active">全部</button><button class="setting-option">未观看</button><button class="setting-option">观看中</button><button class="setting-option">已看完</button></div></section><section class="setting-group"><h3>分辨率</h3><div class="setting-options"><button class="setting-option active">全部</button><button class="setting-option">4K</button><button class="setting-option">1080p</button><button class="setting-option">720p</button><button class="setting-option">SD</button></div></section></aside>
  </div></div></div></div>
  <div class="toast" id="toast"><i class="ti ti-check"></i><span>布局已切换</span></div>
  <script>
    const grid=document.getElementById('mediaGrid'),toast=document.getElementById('toast'),search=document.getElementById('searchInput'),cards=[...document.querySelectorAll('.card')],count=document.getElementById('resultCount');
    function notify(message){toast.querySelector('span').textContent=message;toast.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>toast.classList.remove('show'),1800)}
    function setLayout(layout){grid.className='media-grid '+(layout==='grid'?'':layout);document.querySelectorAll('[data-layout]').forEach(item=>{item.classList.toggle('active',item.dataset.layout===layout);item.setAttribute('aria-pressed',String(item.dataset.layout===layout))});document.querySelectorAll('[data-sheet-layout]').forEach(item=>item.classList.toggle('active',item.dataset.sheetLayout===layout));notify(layout==='grid'?'网格布局':layout==='list'?'列表布局':'瀑布流布局')}
    document.querySelectorAll('[data-layout]').forEach(button=>button.addEventListener('click',()=>setLayout(button.dataset.layout)));
    document.querySelectorAll('[data-sheet-layout]').forEach(button=>button.addEventListener('click',()=>setLayout(button.dataset.sheetLayout)));
    document.querySelectorAll('.filters .chip').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.filters .chip').forEach(item=>{item.classList.toggle('active',item===button);item.setAttribute('aria-selected',String(item===button))});notify('筛选条件已切换')}));
    search.addEventListener('input',()=>{const query=search.value.trim().toLowerCase();let visible=0;cards.forEach(card=>{const show=!query||card.dataset.title.toLowerCase().includes(query);card.hidden=!show;if(show)visible++});count.textContent=visible});
    document.querySelectorAll('.more').forEach(button=>button.addEventListener('click',()=>notify('更多操作已打开')));
    document.querySelectorAll('[data-bottom-nav]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-bottom-nav]').forEach(item=>{item.classList.toggle('active',item===button);item.toggleAttribute('aria-current',item===button)});notify(button.dataset.bottomNav==='settings'?'设置页面即将打开':button.dataset.bottomNav==='home'?'首页即将打开':button.dataset.bottomNav==='organize'?'整理空间即将打开':'已停留在视频')}));
    const sheet=document.getElementById('viewSheet'),sheetScrim=document.getElementById('sheetScrim');function closeSheet(){sheet.classList.remove('open');sheetScrim.classList.remove('open')}document.getElementById('moreButton').addEventListener('click',()=>{sheet.classList.add('open');sheetScrim.classList.add('open')});document.getElementById('sheetClose').addEventListener('click',closeSheet);sheetScrim.addEventListener('click',closeSheet);
  </script>
</body>
</html>
