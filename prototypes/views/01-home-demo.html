<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>影里 · 首页 Demo</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.34.1/dist/tabler-icons.min.css">
  <style>
    :root {
      color-scheme: light;
      --page: #f5f5f5;
      --surface: #ffffff;
      --surface-subtle: #fafafa;
      --surface-muted: #eeeeee;
      --surface-component: #eeeeee;
      --surface-hover: #e0e0e0;
      --text-primary: #1f1f1f;
      --text-secondary: #525252;
      --text-placeholder: #737373;
      --border-divider: #eeeeee;
      --border-default: #e0e0e0;
      --border-strong: #737373;
      --selection: #1f1f1f;
      --on-selection: #ffffff;
      --shadow-phone: 0 28px 70px rgb(0 0 0 / .34), 0 6px 20px rgb(0 0 0 / .24);
      --shadow-menu: 0 18px 42px rgb(0 0 0 / .48);
    }
    * { box-sizing: border-box; }
    html, body { min-width: 320px; min-height: 100%; }
    body {
      margin: 0;
      background: #e1e3e4;
      color: var(--text-primary);
      font-family: Inter, "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
      letter-spacing: 0;
    }
    button, input { font: inherit; letter-spacing: 0; }
    button { border: 0; color: inherit; cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--text-primary); outline-offset: 2px; }
    [hidden] { display: none !important; }

    .showcase { min-height: 100vh; display: grid; place-items: center; padding: 28px 16px; }
    .phone-shell {
      position: relative;
      width: min(390px, calc(100vw - 32px));
      height: min(844px, calc(100vh - 56px));
      min-height: 640px;
      padding: 9px;
      border: 1px solid #080808;
      border-radius: 45px;
      background: #0a0a0a;
      box-shadow: var(--shadow-phone);
    }
    .phone-screen { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 36px; background: var(--page); }
    .camera-hole {
      position: absolute;
      top: 17px;
      left: 50%;
      z-index: 50;
      width: 10px;
      height: 10px;
      transform: translateX(-50%);
      border: 2px solid #1d1d1d;
      border-radius: 50%;
      background: #050505;
      box-shadow: 0 0 0 2px #0b0b0b;
    }
    .side-key { position: absolute; right: -3px; top: 155px; width: 3px; height: 72px; border-radius: 0 3px 3px 0; background: #202020; }
    .status-bar {
      position: absolute;
      inset: 0 0 auto;
      z-index: 30;
      height: 31px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      font-size: 10px;
      font-weight: 700;
      pointer-events: none;
    }
    .status-icons { display: flex; align-items: center; gap: 5px; font-size: 12px; }
    .app { position: absolute; inset: 31px 0 0; }

    .app-header {
      position: absolute;
      inset: 0 0 auto;
      z-index: 20;
      height: 68px;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 8px 12px 8px 16px;
      border-bottom: 1px solid var(--border-divider);
      background: rgb(255 255 255 / .94);
      backdrop-filter: blur(18px);
    }
    .brand-mark { width: 34px; height: 34px; flex: 0 0 auto; }
    .raster { position: relative; width: 100%; height: 100%; transform: rotate(-45deg); }
    .raster span { position: absolute; left: 50%; height: 3px; border-radius: 3px; background: var(--text-primary); transform: translateX(-50%); }
    .raster span:nth-child(1) { top: 5px; width: 13px; opacity: .4; }
    .raster span:nth-child(2) { top: 11px; width: 22px; opacity: .7; }
    .raster span:nth-child(3) { top: 17px; width: 29px; }
    .raster span:nth-child(4) { top: 23px; width: 22px; opacity: .7; }
    .raster span:nth-child(5) { top: 29px; width: 13px; opacity: .4; }
    .brand-copy { min-width: 0; flex: 1; }
    .brand-name { font-size: 17px; font-weight: 700; line-height: 21px; }
    .sync-state { margin-top: 1px; overflow: hidden; color: var(--text-secondary); font-size: 10px; line-height: 15px; white-space: nowrap; text-overflow: ellipsis; }
    .sync-state.scanning { color: var(--text-primary); }
    .header-actions { display: flex; gap: 2px; }
    .icon-button {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: transparent;
      color: var(--text-secondary);
      font-size: 21px;
      transition: background .16s ease, color .16s ease;
    }
    .icon-button:hover, .icon-button[aria-expanded="true"] { background: var(--surface-component); color: var(--text-primary); }
    .scan-line { position: absolute; right: 0; bottom: -1px; left: 0; height: 2px; overflow: hidden; background: var(--surface-component); opacity: 0; }
    .scan-line::after { content: ""; display: block; width: 38%; height: 100%; background: var(--text-primary); transform: translateX(-110%); }
    .app-header.is-scanning .scan-line { opacity: 1; }
    .app-header.is-scanning .scan-line::after { animation: scan 1.05s ease-in-out infinite; }
    @keyframes scan { to { transform: translateX(285%); } }

    .search-panel {
      position: absolute;
      top: 68px;
      right: 0;
      left: 0;
      z-index: 19;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-divider);
      background: var(--surface);
      transform: translateY(-10px);
      opacity: 0;
      pointer-events: none;
      transition: transform .18s ease, opacity .18s ease;
    }
    .search-panel.open { transform: translateY(0); opacity: 1; pointer-events: auto; }
    .search-field { height: 44px; display: flex; align-items: center; gap: 9px; padding: 0 11px; border: 1px solid var(--border-default); border-radius: 8px; background: var(--surface-subtle); color: var(--text-secondary); }
    .search-field input { min-width: 0; flex: 1; border: 0; outline: 0; background: transparent; color: var(--text-primary); font-size: 13px; }
    .search-field input::placeholder { color: var(--text-placeholder); }
    .search-clear { width: 32px; height: 32px; border-radius: 6px; background: transparent; color: var(--text-placeholder); }

    .more-menu {
      position: absolute;
      top: 62px;
      right: 10px;
      z-index: 25;
      width: 188px;
      padding: 6px;
      border: 1px solid var(--border-default);
      border-radius: 8px;
      background: var(--surface-muted);
      box-shadow: var(--shadow-menu);
      transform: translateY(-5px) scale(.98);
      transform-origin: top right;
      opacity: 0;
      pointer-events: none;
      transition: transform .14s ease, opacity .14s ease;
    }
    .more-menu.open { transform: translateY(0) scale(1); opacity: 1; pointer-events: auto; }
    .menu-item { width: 100%; min-height: 42px; display: flex; align-items: center; gap: 11px; padding: 0 10px; border-radius: 6px; background: transparent; color: var(--text-primary); font-size: 13px; text-align: left; }
    .menu-item:hover { background: var(--surface-hover); }
    .menu-item i { width: 19px; color: var(--text-secondary); font-size: 19px; }
    .menu-separator { height: 1px; margin: 5px 4px; background: var(--border-default); }

    .content-scroll { position: absolute; inset: 68px 0 66px; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
    .content-scroll::-webkit-scrollbar { display: none; }
    .content { padding: 18px 16px 28px; }
    .section { margin-top: 26px; }
    .section:first-child { margin-top: 0; }
    .section-header { min-height: 26px; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 11px; }
    .section-title { margin: 0; font-size: 15px; font-weight: 680; line-height: 20px; }
    .section-meta { color: var(--text-placeholder); font-size: 10px; font-weight: 500; }
    .text-button { min-height: 36px; display: inline-flex; align-items: center; gap: 3px; padding: 0 3px 0 9px; border-radius: 6px; background: transparent; color: var(--text-secondary); font-size: 11px; }
    .text-button:hover { background: var(--surface-subtle); color: var(--text-primary); }
    .text-button i { font-size: 17px; }

    .overview { display: grid; grid-template-columns: repeat(2, 1fr); border-top: 1px solid var(--border-divider); border-bottom: 1px solid var(--border-divider); }
    .overview-item { position: relative; padding: 13px 9px 12px; text-align: center; }
    .overview-item + .overview-item::before { content: ""; position: absolute; top: 14px; bottom: 14px; left: 0; width: 1px; background: var(--border-divider); }
    .overview-value { font-size: 20px; font-weight: 720; line-height: 25px; }
    .overview-label { margin-top: 2px; color: var(--text-placeholder); font-size: 10px; }
    .stats-card { overflow: hidden; border: 1px solid var(--border-default); border-radius: 8px; background: var(--surface); }
    .stats-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 14px 10px; }
    .stats-heading h2 { margin: 0; font-size: 14px; font-weight: 680; }
    .stats-heading span { color: var(--text-placeholder); font-size: 10px; }
    .stats-link { width: 36px; height: 36px; display: grid; place-items: center; margin: -6px -6px -6px 0; border-radius: 7px; background: transparent; color: var(--text-secondary); font-size: 18px; }
    .stats-link:hover { background: var(--surface-component); color: var(--text-primary); }
    .stats-divider { height: 1px; margin: 0 14px; background: var(--border-divider); }
    .stats-storage { padding: 12px 14px 14px; }
    .action-button { min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--border-default); border-radius: 8px; background: var(--surface-subtle); color: var(--text-primary); font-size: 12px; font-weight: 620; }
    .action-button:hover { background: var(--surface-component); }
    .action-button.primary { border-color: var(--selection); background: var(--selection); color: var(--on-selection); }
    .action-button i { font-size: 18px; }

    .continue-list, .recent-list { display: flex; gap: 10px; margin: 0 -16px; padding: 0 16px 4px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
    .continue-list::-webkit-scrollbar, .recent-list::-webkit-scrollbar { display: none; }
    .continue-card { position: relative; flex: 0 0 78%; aspect-ratio: 16 / 9; overflow: hidden; border: 1px solid var(--border-default); border-radius: 8px; background: var(--surface-subtle); color: #ffffff; scroll-snap-align: start; text-align: left; }
    .continue-card img, .recent-thumb img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .continue-card::after { content: ""; position: absolute; inset: 32% 0 0; background: linear-gradient(transparent, rgb(0 0 0 / .9)); pointer-events: none; }
    .continue-copy { position: absolute; right: 12px; bottom: 12px; left: 12px; z-index: 2; }
    .continue-title { display: block; overflow: hidden; font-size: 13px; font-weight: 650; white-space: nowrap; text-overflow: ellipsis; }
    .continue-meta { display: flex; justify-content: space-between; gap: 8px; margin-top: 5px; color: #dedede; font-size: 9px; }
    .progress-track { display: block; height: 3px; margin-top: 7px; overflow: hidden; border-radius: 2px; background: rgb(255 255 255 / .28); }
    .progress-value { display: block; height: 100%; border-radius: inherit; background: #f5f5f5; }
    .play-indicator { position: absolute; top: 11px; left: 11px; z-index: 2; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; background: rgb(15 15 15 / .78); color: white; font-size: 17px; backdrop-filter: blur(8px); }

    .recent-card { flex: 0 0 138px; min-width: 0; padding: 0; background: transparent; scroll-snap-align: start; text-align: left; }
    .recent-thumb { position: relative; display: block; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 7px; background: var(--surface-muted); }
    .duration { position: absolute; right: 5px; bottom: 5px; padding: 2px 4px; border-radius: 3px; background: rgb(0 0 0 / .76); color: #fff; font-size: 8px; }
    .recent-title { display: block; margin-top: 7px; overflow: hidden; color: var(--text-primary); font-size: 11px; font-weight: 620; line-height: 15px; white-space: nowrap; text-overflow: ellipsis; }
    .recent-meta { display: block; margin-top: 2px; color: var(--text-placeholder); font-size: 9px; }

    .home-card { overflow: hidden; border: 1px solid var(--border-default); border-radius: 8px; background: var(--surface); }
    .home-card-head { min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 12px 5px 14px; }
    .home-card-head h2 { margin: 0; font-size: 14px; font-weight: 680; }
    .home-card-head .section-meta { margin-left: 5px; }
    .collection-list { display: flex; gap: 12px; margin: 0; padding: 0 12px 14px; overflow-x: auto; scrollbar-width: none; }
    .collection-list::-webkit-scrollbar { display: none; }
    .collection-item { flex: 0 0 150px; min-width: 0; padding: 0; background: transparent; color: var(--text-primary); text-align: left; }
    .collection-cover { display: grid; grid-template-columns: repeat(2, 1fr); aspect-ratio: 16 / 9; overflow: hidden; border-radius: 7px; background: var(--surface-muted); }
    .collection-cover img { width: 100%; height: 100%; min-height: 0; display: block; object-fit: cover; }
    .collection-name { display: block; margin-top: 7px; overflow: hidden; font-size: 11px; font-weight: 640; line-height: 15px; text-overflow: ellipsis; white-space: nowrap; }
    .collection-meta { display: block; margin-top: 2px; color: var(--text-placeholder); font-size: 9px; }

    .maintenance-list { padding: 0 14px 4px; }
    .maintenance-row { width: 100%; min-height: 58px; display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--border-divider); background: transparent; color: var(--text-primary); text-align: left; }
    .maintenance-row:hover { background: var(--surface-subtle); }
    .maintenance-icon { width: 32px; height: 32px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 7px; background: var(--surface-component); color: var(--text-secondary); font-size: 17px; }
    .maintenance-copy { min-width: 0; flex: 1; }
    .maintenance-title { display: block; overflow: hidden; font-size: 11px; font-weight: 640; line-height: 15px; text-overflow: ellipsis; white-space: nowrap; }
    .maintenance-meta { display: block; margin-top: 2px; overflow: hidden; color: var(--text-secondary); font-size: 9px; line-height: 13px; text-overflow: ellipsis; white-space: nowrap; }
    .maintenance-row > i { color: var(--text-placeholder); font-size: 16px; }

    .folder-list { border-top: 1px solid var(--border-divider); }
    .folder-row { width: 100%; min-height: 58px; display: flex; align-items: center; gap: 11px; padding: 8px 2px; border-bottom: 1px solid var(--border-divider); background: transparent; text-align: left; }
    .folder-row:hover { background: var(--surface-subtle); }
    .folder-icon { width: 36px; height: 36px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 7px; background: var(--surface-component); color: var(--text-secondary); font-size: 19px; }
    .folder-copy { min-width: 0; flex: 1; }
    .folder-name { display: block; overflow: hidden; font-size: 12px; font-weight: 630; white-space: nowrap; text-overflow: ellipsis; }
    .folder-meta { display: block; margin-top: 3px; color: var(--text-placeholder); font-size: 9px; }
    .folder-row > i { color: var(--text-placeholder); font-size: 17px; }

    .storage { padding: 0; }
    .storage-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .storage-label { font-size: 12px; font-weight: 630; }
    .storage-value { color: var(--text-secondary); font-size: 10px; }
    .storage-bar { height: 7px; display: flex; gap: 2px; margin-top: 12px; overflow: hidden; border-radius: 4px; background: var(--surface-component); }
    .storage-video { width: 60%; background: var(--text-primary); }
    .storage-other { width: 16%; background: var(--border-strong); }
    .storage-available { flex: 1; background: var(--surface-component); }
    .storage-legend { display: flex; gap: 14px; margin-top: 10px; color: var(--text-placeholder); font-size: 9px; }
    .legend-item { display: flex; align-items: center; gap: 5px; }
    .legend-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-primary); }
    .legend-dot.other { background: var(--border-strong); }
    .legend-dot.available { border: 1px solid var(--border-default); background: var(--surface-component); }

    .bottom-nav { position: absolute; right: 0; bottom: 0; left: 0; z-index: 20; height: 66px; display: grid; grid-template-columns: repeat(3, 1fr); padding: 5px 12px 7px; border-top: 1px solid var(--border-divider); background: rgb(255 255 255 / .96); backdrop-filter: blur(18px); }
    .nav-button { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 7px; background: transparent; color: var(--text-placeholder); font-size: 9px; }
    .nav-button i { font-size: 21px; }
    .nav-button[aria-current="page"] { color: var(--text-primary); }
    .nav-button[aria-current="page"]::before { content: ""; position: absolute; top: 0; width: 22px; height: 2px; border-radius: 2px; background: var(--text-primary); }
    .nav-badge { position: absolute; top: 6px; left: calc(50% + 8px); min-width: 17px; height: 17px; display: grid; place-items: center; padding: 0 4px; border: 2px solid var(--surface); border-radius: 9px; background: var(--text-primary); color: var(--page); font-size: 8px; font-weight: 750; }

    .scrim { position: absolute; inset: 0; z-index: 34; background: rgb(0 0 0 / .58); opacity: 0; pointer-events: none; transition: opacity .18s ease; }
    .scrim.open { opacity: 1; pointer-events: auto; }
    .sheet { position: absolute; right: 0; bottom: 0; left: 0; z-index: 35; padding: 9px 16px 22px; border-top: 1px solid var(--border-default); border-radius: 14px 14px 0 0; background: var(--surface); transform: translateY(102%); transition: transform .24s cubic-bezier(.2,.8,.2,1); }
    .sheet.open { transform: translateY(0); }
    .sheet-handle { width: 34px; height: 4px; margin: 0 auto 14px; border-radius: 2px; background: var(--border-strong); }
    .sheet-header { display: flex; align-items: center; justify-content: space-between; min-height: 42px; }
    .sheet-title { margin: 0; font-size: 16px; }
    .sheet p { margin: 7px 0 17px; color: var(--text-secondary); font-size: 11px; line-height: 17px; }
    .sheet-actions { display: grid; gap: 8px; }
    .sheet-actions .action-button { width: 100%; }
    .editor-sheet { max-height: 88%; display: flex; flex-direction: column; }
    .editor-sheet .sheet-header { flex: 0 0 auto; }
    .card-order-list { min-height: 0; display: grid; gap: 6px; overflow-y: auto; padding: 5px 0 12px; scrollbar-width: thin; }
    .card-order-row { min-height: 56px; display: grid; grid-template-columns: 32px minmax(0, 1fr) 38px 36px; align-items: center; gap: 8px; padding: 5px 8px; border: 1px solid var(--border-default); border-radius: 8px; background: var(--surface-subtle); transition: opacity .16s ease, transform .16s ease, box-shadow .16s ease; }
    .card-order-row.is-hidden { opacity: .52; }
    .card-order-row.is-dragging { position: relative; z-index: 2; opacity: .9; box-shadow: 0 8px 18px rgb(0 0 0 / .16); transform: scale(1.015); }
    .order-icon { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 7px; background: var(--surface-component); color: var(--text-secondary); font-size: 17px; }
    .order-label { min-width: 0; overflow: hidden; font-size: 12px; font-weight: 630; text-overflow: ellipsis; white-space: nowrap; }
    .visibility-toggle, .drag-handle { width: 36px; height: 42px; display: grid; place-items: center; border-radius: 7px; background: transparent; color: var(--text-secondary); font-size: 18px; }
    .visibility-toggle:hover, .drag-handle:hover { background: var(--surface-component); color: var(--text-primary); }
    .visibility-toggle[aria-pressed="false"] { color: var(--text-placeholder); }
    .drag-handle { touch-action: none; cursor: grab; }
    .drag-handle:active { cursor: grabbing; }
    .editor-actions { grid-template-columns: 1fr 1fr; flex: 0 0 auto; padding-top: 4px; }
    .toast { position: absolute; right: 16px; bottom: 78px; left: 16px; z-index: 45; min-height: 44px; display: flex; align-items: center; gap: 9px; padding: 0 13px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--text-primary); color: var(--on-selection); box-shadow: var(--shadow-menu); font-size: 11px; transform: translateY(12px); opacity: 0; pointer-events: none; transition: transform .18s ease, opacity .18s ease; }
    .toast.show { transform: translateY(0); opacity: 1; }
    .empty-search { padding: 30px 10px; color: var(--text-secondary); font-size: 12px; text-align: center; }

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    @media (max-width: 430px) {
      .showcase { padding: 0; }
      .phone-shell { width: 100vw; height: 100vh; min-height: 0; padding: 0; border: 0; border-radius: 0; box-shadow: none; }
      .phone-screen { border-radius: 0; }
      .camera-hole, .side-key { display: none; }
    }
  </style>
</head>
<body>
  <main class="showcase">
    <div class="phone-shell" aria-label="影里首页手机预览">
      <span class="camera-hole" aria-hidden="true"></span>
      <span class="side-key" aria-hidden="true"></span>
      <div class="phone-screen">
        <div class="status-bar" aria-hidden="true"><span>09:41</span><span class="status-icons"><i class="ti ti-signal-4g"></i><i class="ti ti-wifi"></i><i class="ti ti-battery-4"></i></span></div>
        <div class="app">
          <header class="app-header" id="appHeader">
            <div class="brand-mark" aria-hidden="true"><div class="raster"><span></span><span></span><span></span><span></span><span></span></div></div>
            <div class="brand-copy"><div class="brand-name">影里</div><div class="sync-state" id="syncState">3 个目录 · 12 分钟前扫描</div></div>
            <div class="header-actions">
              <button class="icon-button" id="searchToggle" aria-label="搜索" aria-expanded="false" title="搜索"><i class="ti ti-search"></i></button>
              <button class="icon-button" id="moreToggle" aria-label="更多" aria-expanded="false" title="更多"><i class="ti ti-dots-vertical"></i></button>
            </div>
            <div class="scan-line" aria-hidden="true"></div>
          </header>

          <div class="search-panel" id="searchPanel">
            <div class="search-field"><i class="ti ti-search"></i><input id="searchInput" type="search" aria-label="搜索视频或文件夹" placeholder="搜索视频或文件夹" autocomplete="off"><button class="search-clear" id="searchClear" type="button" aria-label="清空搜索"><i class="ti ti-x"></i></button></div>
          </div>
          <div class="more-menu" id="moreMenu" role="menu">

            <div class="sheet-header"><h2 class="sheet-title">自定义首页</h2><button class="icon-button" id="editorClose" aria-label="关闭"><i class="ti ti-x"></i></button></div>
            <div class="card-order-list" id="cardOrderList" aria-label="首页卡片排序"></div>
            <div class="sheet-actions editor-actions"><button class="action-button" id="editorReset">恢复默认</button><button class="action-button primary" id="editorDone">完成</button></div>
          </section>

  </main>

  <script>
    const $ = selector => document.querySelector(selector);
    const $$ = selector => [...document.querySelectorAll(selector)];
    const toast = $('#toast');
    let toastTimer;
    function notify(message) {
      toast.querySelector('span').textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1900);
    }

    const homeContent = $('#homeContent');
    const emptySearch = $('#emptySearch');
    const defaultCardOrder = ['stats', 'continue', 'recent', 'collections', 'folders', 'maintenance'];
    const cardMeta = {
      stats: { label: '统计卡片', icon: 'ti-chart-dots' },
      continue: { label: '继续观看', icon: 'ti-player-play' },
      recent: { label: '最近添加', icon: 'ti-clock' },
      collections: { label: '我的合集', icon: 'ti-album' },
      folders: { label: '常用文件夹', icon: 'ti-folder' },
      maintenance: { label: '需要处理', icon: 'ti-tool' }
    };
    const cardSections = new Map($$('#homeContent > [data-card-id]').map(section => [section.dataset.cardId, section]));
    function readStoredArray(key) {
      try { const value = JSON.parse(localStorage.getItem(key) || 'null'); return Array.isArray(value) ? value : null; } catch { return null; }
    }
    function normalizeOrder(value) {
      const known = new Set(defaultCardOrder);
      return [...new Set([...(value || []), ...defaultCardOrder])].filter(id => known.has(id));
    }
    let cardOrder = normalizeOrder(readStoredArray('yingli-home-card-order'));
    let hiddenCardIds = new Set((readStoredArray('yingli-home-card-hidden') || []).filter(id => defaultCardOrder.includes(id)));
    function persistCardConfig() {
      try {
        localStorage.setItem('yingli-home-card-order', JSON.stringify(cardOrder));
        localStorage.setItem('yingli-home-card-hidden', JSON.stringify([...hiddenCardIds]));
      } catch { /* file:// 环境可能禁用本地存储，Demo 仍可在当前会话工作。 */ }
    }
    function applyHomeCardState() {
      cardOrder.forEach(id => { const section = cardSections.get(id); if (section) homeContent.insertBefore(section, emptySearch); });
      const query = searchInput.value.trim().toLowerCase();
      let visible = 0;
      cardSections.forEach(section => {
        const matches = !query || section.dataset.search.toLowerCase().includes(query);
        const show = !hiddenCardIds.has(section.dataset.cardId) && matches;
        section.hidden = !show;
        if (show) visible += 1;
      });
      emptySearch.hidden = !query || visible > 0;
    }

    const searchPanel = $('#searchPanel');
    const searchToggle = $('#searchToggle');
    const searchInput = $('#searchInput');
    function setSearch(open) {
      searchPanel.classList.toggle('open', open);
      searchToggle.setAttribute('aria-expanded', String(open));
      searchToggle.setAttribute('aria-label', open ? '关闭搜索' : '搜索');
      if (open) setTimeout(() => searchInput.focus(), 80);
    }
    searchToggle.addEventListener('click', () => { closeMenu(); setSearch(!searchPanel.classList.contains('open')); });
    $('#searchClear').addEventListener('click', () => { searchInput.value = ''; searchInput.dispatchEvent(new Event('input')); searchInput.focus(); });
    searchInput.addEventListener('input', () => {
      applyHomeCardState();
    });

    const moreMenu = $('#moreMenu');
    const moreToggle = $('#moreToggle');
    function closeMenu() { moreMenu.classList.remove('open'); moreToggle.setAttribute('aria-expanded', 'false'); }
    moreToggle.addEventListener('click', event => {
      event.stopPropagation();
      setSearch(false);
      const open = moreMenu.classList.toggle('open');
      moreToggle.setAttribute('aria-expanded', String(open));
    });
    document.addEventListener('click', event => { if (!moreMenu.contains(event.target) && !moreToggle.contains(event.target)) closeMenu(); });

    let scanTimer;
    function startScan() {
      closeMenu();
      const header = $('#appHeader');
      const state = $('#syncState');
      clearTimeout(scanTimer);
      header.classList.add('is-scanning');
      state.classList.add('scanning');
      state.textContent = '正在扫描新增视频…';
      scanTimer = setTimeout(() => {
        header.classList.remove('is-scanning');
        state.classList.remove('scanning');
        state.textContent = '3 个目录 · 刚刚扫描';
        notify('扫描完成，新增 12 个视频');
      }, 2600);
    }
    $('#scanMenu').addEventListener('click', startScan);

    const sheet = $('#directorySheet');
    const editorSheet = $('#homeEditorSheet');
    const scrim = $('#scrim');
    function closeSheets() {
      sheet.classList.remove('open');
      editorSheet.classList.remove('open');
      scrim.classList.remove('open');
    }
    function openSheet(target) {
      closeSheets();
      $(target).classList.add('open');
      scrim.classList.add('open');
    }
    $$('[data-open-sheet="directory"]').forEach(button => button.addEventListener('click', () => { closeMenu(); openSheet('#directorySheet'); }));
    $('#sheetClose').addEventListener('click', closeSheets);
    $('#finishDirectory').addEventListener('click', closeSheets);
    scrim.addEventListener('click', closeSheets);
    $('#chooseDirectory').addEventListener('click', () => notify('已添加目录，可继续选择'));

    const cardOrderList = $('#cardOrderList');
    function renderEditorRows() {
      cardOrderList.replaceChildren();
      cardOrder.forEach(id => {
        const meta = cardMeta[id];
        const hidden = hiddenCardIds.has(id);
        const row = document.createElement('div');
        row.className = `card-order-row${hidden ? ' is-hidden' : ''}`;
        row.dataset.cardId = id;
        row.innerHTML = `<span class="order-icon"><i class="ti ${meta.icon}"></i></span><span class="order-label">${meta.label}</span><button class="visibility-toggle" type="button" aria-label="${hidden ? '显示' : '隐藏'}${meta.label}" aria-pressed="${!hidden}"><i class="ti ${hidden ? 'ti-eye-off' : 'ti-eye'}"></i></button><button class="drag-handle" type="button" aria-label="拖动${meta.label}" title="拖动排序"><i class="ti ti-grip-vertical"></i></button>`;
        cardOrderList.append(row);
      });
    }
    function syncEditorOrder() {
      cardOrder = $$('#cardOrderList .card-order-row').map(row => row.dataset.cardId);
      persistCardConfig();
      applyHomeCardState();
    }
    function finishDrag() {
      if (!draggedRow) return;
      draggedRow.classList.remove('is-dragging');
      draggedRow = null;
      syncEditorOrder();
      renderEditorRows();
    }
    let draggedRow = null;
    cardOrderList.addEventListener('pointerdown', event => {
      const handle = event.target.closest('.drag-handle');
      if (!handle) return;
      draggedRow = handle.closest('.card-order-row');
      draggedRow.classList.add('is-dragging');
      handle.setPointerCapture(event.pointerId);
    });
    cardOrderList.addEventListener('pointermove', event => {
      if (!draggedRow) return;
      const rows = $$('#cardOrderList .card-order-row').filter(row => row !== draggedRow);
      const target = rows.find(row => event.clientY < row.getBoundingClientRect().top + row.getBoundingClientRect().height / 2);
      if (target) cardOrderList.insertBefore(draggedRow, target); else cardOrderList.append(draggedRow);
    });
    cardOrderList.addEventListener('pointerup', finishDrag);
    cardOrderList.addEventListener('pointercancel', finishDrag);
    cardOrderList.addEventListener('click', event => {
      const toggle = event.target.closest('.visibility-toggle');
      if (!toggle) return;
      const row = toggle.closest('.card-order-row');
      const id = row.dataset.cardId;
      if (hiddenCardIds.has(id)) hiddenCardIds.delete(id); else hiddenCardIds.add(id);
      persistCardConfig();
      renderEditorRows();
      applyHomeCardState();
    });
    cardOrderList.addEventListener('keydown', event => {
      const handle = event.target.closest('.drag-handle');
      if (!handle || !['ArrowUp', 'ArrowDown'].includes(event.key)) return;
      event.preventDefault();
      const row = handle.closest('.card-order-row');
      const sibling = event.key === 'ArrowUp' ? row.previousElementSibling : row.nextElementSibling;
      if (!sibling) return;
      if (event.key === 'ArrowUp') cardOrderList.insertBefore(row, sibling); else cardOrderList.insertBefore(sibling, row);
      syncEditorOrder();
      renderEditorRows();
    });
    $$('[data-open-sheet="home-editor"]').forEach(button => button.addEventListener('click', () => {
      closeMenu();
      setSearch(false);
      renderEditorRows();
      openSheet('#homeEditorSheet');
    }));
    $('#editorClose').addEventListener('click', closeSheets);
    $('#editorDone').addEventListener('click', () => { closeSheets(); notify('首页布局已保存'); });
    $('#editorReset').addEventListener('click', () => {
      cardOrder = [...defaultCardOrder];
      hiddenCardIds.clear();
      persistCardConfig();
      renderEditorRows();
      applyHomeCardState();
      notify('已恢复默认布局');
    });

    $$('[data-message]').forEach(button => button.addEventListener('click', () => { closeMenu(); notify(button.dataset.message); }));
    $$('[data-nav]').forEach(button => button.addEventListener('click', () => {
      $$('[data-nav]').forEach(item => item.removeAttribute('aria-current'));
      button.setAttribute('aria-current', 'page');
      notify(button.dataset.nav === '首页' ? '已回到首页' : `${button.dataset.nav}页面即将打开`);
    }));
    applyHomeCardState();
  </script>
